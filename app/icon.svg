<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="ATMOS">
  <!--
    Favicon ATMOS — le Λ du logotype, isolé.

    Le logotype complet est horizontal (662 × 104) et illisible à 16 px : seule
    la première lettre tient dans un carré. Le tracé est repris tel quel depuis
    `public/logo.svg`, mis à l'échelle 0,6 et centré, pour que la marque et
    l'onglet ne divergent pas.

    Fond sombre et Λ cyan : le carré porte le mark sur les barres d'onglets
    claires, et se fond dans les sombres en ne laissant que le cyan, qui
    ressort dans les deux cas.
  -->
  <defs>
    <linearGradient id="atmos-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="55%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="#0B0C10" />

  <g transform="translate(26.6 20) scale(0.6)">
    <path d="M0 100 L39 0 L78 100 L58 100 L39 51.3 L20 100 Z" fill="url(#atmos-accent)" />
  </g>
</svg>
